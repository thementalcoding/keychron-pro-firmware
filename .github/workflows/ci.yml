name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify firmware binaries (DFU suffix, size, VID/PID, CRC)
        run: python3 tools/verify_bins.py

      - name: Verify published checksums
        run: |
          if [ -f SHA256SUMS ]; then
            sha256sum -c SHA256SUMS
          else
            echo "no SHA256SUMS present"
          fi

      - name: Verify manifest ↔ files ↔ checksums
        run: |
          if [ -f firmware/manifest.json ]; then
            python3 tools/verify_manifest.py
          else
            echo "no manifest present"
          fi

      - name: Docs and tree consistency
        run: python3 tools/verify_repo.py

      - name: Shell syntax
        run: bash -n tools/*.sh

      - name: ShellCheck
        run: shellcheck -S warning tools/*.sh

      - name: Python syntax
        run: python3 -m py_compile tools/*.py tools/dfu-suffix tools/medir_polling.py

      - name: Privacy guard (no personal data in the tree)
        run: python3 tools/check_sanitization.py
