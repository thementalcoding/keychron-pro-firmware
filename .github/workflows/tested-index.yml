name: Hardware test index

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hardware-test-index
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Classify the report (issue opened/edited only)
        if: >-
          github.event_name == 'issues' &&
          (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/hardware_tests.py label "${{ github.event.issue.number }}"

      - name: Rebuild TESTED.md and docs/tested.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/hardware_tests.py index

      - name: Publish to the tested-index branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTED.md docs/tested.json
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "chore: refresh hardware test index"
          fi
          # main is protected; the generated index lives on its own branch so the
          # README can link to it and the badge can read it without bypassing CI.
          git push --force origin HEAD:tested-index
